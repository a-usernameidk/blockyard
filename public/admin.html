<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blockyard Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .adm-list { display: flex; flex-direction: column; gap: 14px; }
  .adm-row { display: grid; grid-template-columns: 200px 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  .adm-row canvas { width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--line); border-radius: 8px; }
  .adm-row.hidden-game { background: #ffe3ea; color: var(--ink); }
  @media (max-width: 700px) { .adm-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top"><a class="logo" href="./"><span class="logo-block" aria-hidden="true"></span>Blockyard Admin</a></header>
<main>
  <form id="login" class="import">
    <label for="key">Admin password (the ADMIN_KEY secret you set in Cloudflare)</label>
    <div class="row"><input id="key" type="password" autocomplete="current-password"><button class="btn btn-sun" type="submit">Open</button></div>
    <p class="msg" id="msg"></p>
  </form>
  <h2>Published levels</h2>
  <p class="lede">Reported and hidden levels are listed first. A level hides itself after 3 different people report it.</p>
  <div class="adm-list" id="list"></div>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
